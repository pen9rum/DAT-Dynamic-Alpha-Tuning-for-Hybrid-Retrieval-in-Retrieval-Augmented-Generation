# Shared defaults. Dataset configs set `base: base.yaml` and override.
seed: 42

paths:
  cache_dir: cache
  runs_dir: runs

retrieval:
  sparse: {k1: 0.9, b: 0.4, tokenizer: en}
  dense:
    model: intfloat/multilingual-e5-small     # CPU-friendly, handles en + zh
    query_prefix: "query: "
    passage_prefix: "passage: "
    batch_size: 64
    max_seq_length: 512
    device: auto
  candidates: {sparse_top_k: 100, dense_top_k: 100}   # pool = union of both top-K

fusion:
  alpha_grid: {start: 0.0, stop: 1.0, step: 0.1}      # alpha weights DENSE (DAT convention)
  normalization: minmax                               # minmax | zscore | rank | rrf
  rrf_k: 60
  compare_normalizations: [minmax, zscore, rank, rrf]

evaluation:
  reward: hit@1                  # primary reward (DAT reports P@1)
  metrics_k: [1, 3, 5, 10, 20]
  ndcg_k: 10
  topk_store: 10
  oracle_tie_break: closest_to_global   # closest_to_global | smallest | largest | center
  bootstrap: 1000
  category_metrics: [hit@1, hit@5, hit@20]
  report_metrics: [hit@1, hit@5, hit@20, mrr, ndcg@10]
  min_meaningful_gap: 0.01

online:
  policies: [global_tuned, ucb, linucb]
  stream_split: train
  eval_split: test
  max_stream: null
  checkpoints: [0, 10, 25, 50, 100, 250, 500, 1000, 2000, 4000, 8000]
  n_runs: 5
  feedback: bandit               # bandit (chosen alpha only) | full (all alphas revealed)
  use_query_embedding: false
  ucb: {c: 1.0}
  linucb: {c: 1.0, ridge: 1.0}

llm:                             # OpenRouter; key left empty in .env until needed
  model: openai/gpt-4o
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 16
  cache_path: cache/llm_cache.sqlite
