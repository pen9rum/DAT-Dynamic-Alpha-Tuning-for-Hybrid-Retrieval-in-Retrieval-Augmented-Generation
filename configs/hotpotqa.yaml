base: beir_base.yaml
name: hotpotqa
dataset:
  loader: beir_pyserini
  beir_name: hotpotqa
  max_queries: 1200          # of 7405 BEIR test queries: each batch = one scan of a 16 GB flat index on a laptop CPU
  n_hops: 2
retrieval:
  sparse_index: beir-v1.0.0-hotpotqa.flat
  dense_index: beir-v1.0.0-hotpotqa.bge-base-en-v1.5
  dense:
    mmap: true               # page-cache backed instead of a full RAM copy
  candidates:
    query_batch: 512
