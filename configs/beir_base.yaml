# Cross-dataset suite: Pyserini Lucene BM25 + FAISS flat BGE-base-en-v1.5 everywhere.
base: base.yaml

retrieval:
  backend: pyserini
  sparse: {k1: 0.9, b: 0.4, threads: 8}
  dense:
    model: BAAI/bge-base-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
    batch_size: 64
    max_seq_length: 512
    mmap: false
  candidates: {sparse_top_k: 100, dense_top_k: 100, rank_depth: 1000}   # ranks beyond depth are censored

dataset:
  split:
    fractions: {val: 0.3, test: 0.7}   # BEIR test queries split once, randomly (seeded)

evaluation:
  metrics_k: [1, 3, 5, 10, 20]
  category_metrics: [hit@1, hit@5, allrel@10]
  report_metrics: [hit@1, recall@5, mrr, ndcg@10, allrel@10]

fusion:
  compare_normalizations: [minmax, zscore]

multihop:
  k_hop: 5                       # docs added per hop; final evidence set = H * k_hop
  metrics: [success, recall, mrr]
